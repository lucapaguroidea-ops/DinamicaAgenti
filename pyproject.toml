[project]
name = "dinamicaagenti"
version = "0.0.1"
description = "Gated paths for documente primare to SAGA C: the gate kit, catalog and hanks"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "defusedxml>=0.7",
    "poarta-contabila",
    "pydantic>=2.7",
    "pyyaml>=6",
]

[project.scripts]
kit = "kit.cli:main"

[dependency-groups]
dev = [
    "jsonschema>=4.22",
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["kit"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"
markers = ["law(*ids): the LAW.md principles this test enforces (P<n>)"]

[tool.uv.sources]
poarta-contabila = { git = "https://github.com/lucapaguroidea-ops/PoartaContabila", rev = "413c71c151411682a093a28f4f7d3d62dbec5992" }
